          echo "##### 《浯島城事》 #####"
          probe "《浯島城事》·源1" "https://kinmen-story.tw/"
          echo "##### 《今日馬祖季刊》 #####"
          probe "《今日馬祖季刊》·源1" "https://client.matsu.idv.tw/literature/periodical-today-s.html"
          echo "##### 《去（Khù）海女神龍》 #####"
          probe "《去（Khù）海女神龍》·源1" "https://www.yda.gov.tw/docDetail.aspx?docid=57648&pid=84&uid=30300"
          echo "##### 《原曜臺中》 #####"
          probe "《原曜臺中》·源1" "https://issuu.com/chiefad/docs/_vol_11_"
          echo "##### 《南投風華》 #####"
          probe "《南投風華》·源1" "https://issuu.com/chiefad/docs/_120_"
          echo "##### 《彰化味》 #####"
          probe "《彰化味》·源1" "https://issuu.com/chiefad/docs/_no112"
          echo "##### 《桃園客家》 #####"
          probe "《桃園客家》·源1" "https://www.hakka.tycg.gov.tw/News_Photo.aspx?n=11478&sms=17532"
          echo "##### 《桃園藝文》 #####"
          probe "《桃園藝文》·源1" "https://culture.tycg.gov.tw/News.aspx?n=11229&sms=14623"
          echo "##### 《文化開傳》 #####"
          probe "《文化開傳》·源1" "https://klctb.klcg.gov.tw/News2.aspx?n=7775&sms=12517"
          probe "《文化開傳》·源2" "https://www.pubu.com.tw/search?q=%E6%96%87%E5%8C%96%E9%96%8B%E5%82%B3"
