          echo "##### 《南風澳地方誌》 #####"
          probe "《南風澳地方誌》·源1" "https://www.lym.gov.tw/ch/collection/epaper/epaper-detail/33b6fa92-4a79-11eb-b345-27635ee"
          echo "##### 《蘇澳人》 #####"
          probe "《蘇澳人》·源1" "https://www.suao.gov.tw/News.aspx?n=13752&sms=13440"
          echo "===== 调研完成 ====="
